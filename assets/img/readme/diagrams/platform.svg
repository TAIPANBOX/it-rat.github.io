<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -18 996 436" width="996" height="436" role="img" aria-label="Platform: fourteen registered sources write one envelope onto one NDJSON bus, and five consumers read it back">
  <title>Platform: fourteen registered sources write one envelope onto one NDJSON bus, and five consumers read it back</title>
  <rect x="-18" y="-18" width="996" height="436" rx="16" fill="#0A0E13"/>
  <rect x="-17.5" y="-17.5" width="995" height="435" rx="15.5" fill="none" stroke="rgba(255,255,255,.09)"/>

        <defs><marker id="ap" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5A6675"/></marker></defs>
        <g font-family="ui-monospace,Menlo" text-anchor="middle">
          <!-- thirteen registered sources, two rows; the fourteenth is
               agent-conform, drawn as the consumer below with a wire in its
               own colour back to the bus for the chain findings it writes. The second
               row is offset by
               half a cell so the first row's arrows pass through its gaps
               rather than through its boxes, which is why nothing below here
               had to move when the registry grew past seven. -->
          <g font-size="11" font-weight="700">
            <rect x="20"  y="14" width="88" height="28" rx="9" fill="#141C27" stroke="#F4B23E"/><text x="64"  y="32" fill="#F4B23E">tokenfuse</text>
            <rect x="116" y="14" width="88" height="28" rx="9" fill="#141C27" stroke="#6C7BFF"/><text x="160" y="32" fill="#6C7BFF">engram</text>
            <rect x="212" y="14" width="88" height="28" rx="9" fill="#141C27" stroke="#34D399"/><text x="256" y="32" fill="#34D399">idryx</text>
            <rect x="308" y="14" width="88" height="28" rx="9" fill="#141C27" stroke="#B48CFF"/><text x="352" y="32" fill="#B48CFF">qryx</text>
            <rect x="404" y="14" width="88" height="28" rx="9" fill="#141C27" stroke="#2DD4BF"/><text x="448" y="32" fill="#2DD4BF">wardryx</text>
            <rect x="500" y="14" width="88" height="28" rx="9" fill="#141C27" stroke="#FF7AA2"/><text x="544" y="32" fill="#FF7AA2">verdryx</text>
            <rect x="596" y="14" width="88" height="28" rx="9" fill="#141C27" stroke="#FF8A5B"/><text x="640" y="32" fill="#FF8A5B">mockryx</text>
            <rect x="68"  y="48" width="88" height="28" rx="9" fill="#141C27" stroke="#B48CFF"/><text x="112" y="66" fill="#B48CFF">console</text>
            <rect x="164" y="48" width="88" height="28" rx="9" fill="#141C27" stroke="#5BC8F5"/><text x="208" y="66" fill="#5BC8F5">heraldyx</text>
            <rect x="260" y="48" width="88" height="28" rx="9" fill="#141C27" stroke="#8B9DFF"/><text x="304" y="66" fill="#8B9DFF">vouchryx</text>
            <rect x="356" y="48" width="88" height="28" rx="9" fill="#141C27" stroke="#F0ABFC"/><text x="400" y="66" fill="#F0ABFC">scopyx</text>
            <rect x="452" y="48" width="88" height="28" rx="9" fill="#141C27" stroke="#7DD3A0"/><text x="496" y="66" fill="#7DD3A0">costcrew</text>
            <rect x="548" y="48" width="88" height="28" rx="9" fill="#141C27" stroke="#60A5FA"/><text x="592" y="66" fill="#60A5FA">typryx</text>
          </g>
          <!-- the bus -->
          <rect x="20" y="84" width="664" height="30" rx="9" fill="#0F151E" stroke="#2a3547"/>
          <text x="352" y="103" fill="#8A97A6" font-size="10.5" letter-spacing="2">agent-event bus &#183; NDJSON &#183; one JSON object per line</text>
          <!-- the envelope card -->
          <rect x="170" y="138" width="364" height="158" rx="14" fill="#10161F" stroke="#93A8C4" stroke-width="1.4"><animate attributeName="stroke-opacity" values="1;.45;1" dur="3.4s" repeatCount="indefinite"/></rect>
          <text x="352" y="162" fill="#93A8C4" font-size="13" font-weight="700">the agent-event envelope</text>
          <line x1="352" y1="174" x2="352" y2="274" stroke="#2a3547"/>
          <text x="256" y="186" fill="#5A6675" font-size="10.5">required</text>
          <text x="448" y="186" fill="#5A6675" font-size="10.5">optional</text>
          <g font-size="10.5" fill="#E9EFF6">
            <text x="256" y="204">schema</text>
            <text x="256" y="221">ts</text>
            <text x="256" y="238">source</text>
            <text x="256" y="255">type</text>
            <text x="256" y="272">agent_id</text>
          </g>
          <g font-size="10.5" fill="#8A97A6">
            <text x="448" y="204">severity</text>
            <text x="448" y="221">run_id</text>
            <text x="448" y="238">on_behalf_of</text>
            <text x="448" y="255">data</text>
            <text x="448" y="272">prev_hash</text>
          </g>
          <text x="352" y="289" fill="#5A6675" font-size="10">prev_hash: sha256 chain &#183; unknown fields ignored</text>
          <!-- consumers. Five now: the record plane reads the same stream and
               seals it, which is what made this row too narrow at four. -->
          <g font-size="10.5" font-weight="700">
            <rect x="20"  y="330" width="124" height="48" rx="10" fill="#141C27" stroke="#93A8C4"/>
            <text x="82"  y="350" fill="#E9EFF6">agent-conform</text>
            <rect x="155" y="330" width="124" height="48" rx="10" fill="#141C27" stroke="#2a3547"/>
            <text x="217" y="350" fill="#E9EFF6">Idryx graph</text>
            <rect x="290" y="330" width="124" height="48" rx="10" fill="#141C27" stroke="#2a3547"/>
            <text x="352" y="350" fill="#E9EFF6">TokenFuse Cloud</text>
            <rect x="425" y="330" width="124" height="48" rx="10" fill="#141C27" stroke="#2a3547"/>
            <text x="487" y="350" fill="#E9EFF6">Heraldyx mail</text>
            <rect x="560" y="330" width="124" height="48" rx="10" fill="#141C27" stroke="#E4626F"/>
            <text x="622" y="350" fill="#E9EFF6">Trailryx records</text>
          </g>
          <g font-size="10" fill="#8A97A6">
            <text x="82" y="366">schemas &#183; chains</text>
            <text x="217" y="366">logged as identity edges</text>
            <text x="352" y="366">evidence packs</text>
            <text x="487" y="366">an alert with a link</text>
            <text x="622" y="366">sealed, hash-chained</text>
          </g>
          <!-- terraform side box -->
          <rect x="720" y="18" width="224" height="360" rx="14" fill="#10161F" stroke="#2a3547"/>
          <text x="832" y="44" fill="#E9EFF6" font-size="12.5" font-weight="700">governance as code</text>
          <text x="832" y="60" fill="#5A6675" font-size="10.5">terraform-provider-taipan</text>
          <g font-size="10.5">
            <rect x="747" y="76" width="170" height="26" rx="8" fill="#141C27" stroke="#2a3547"/><text x="832" y="93" fill="#E9EFF6">write HCL</text>
            <rect x="747" y="122" width="170" height="26" rx="8" fill="#141C27" stroke="#2a3547"/><text x="832" y="139" fill="#E9EFF6">terraform plan &#183; diff</text>
            <rect x="747" y="168" width="170" height="26" rx="8" fill="#141C27" stroke="#2a3547"/><text x="832" y="185" fill="#E9EFF6">terraform apply</text>
          </g>
          <rect x="747" y="214" width="170" height="58" rx="8" fill="#141C27" stroke="#93A8C4"/>
          <g font-size="10.5" fill="#93A8C4">
            <text x="832" y="230">taipan_budget</text>
            <text x="832" y="244">taipan_agent_passport</text>
            <text x="832" y="258">taipan_wardryx_policy</text>
          </g>
          <text x="832" y="296" fill="#8A97A6" font-size="10.5">live in version control,</text>
          <text x="832" y="310" fill="#8A97A6" font-size="10.5">PR-reviewed</text>
          <text x="832" y="336" fill="#5A6675" font-size="10.5">out-of-band edits surface</text>
          <text x="832" y="350" fill="#5A6675" font-size="10.5">in the next plan</text>
        </g>
        <g stroke="#5A6675" stroke-width="1.3" class="flow">
