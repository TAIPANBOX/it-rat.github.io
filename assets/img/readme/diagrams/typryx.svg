<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -18 996 696" width="996" height="696" role="img" aria-label="Typryx: an ask crosses the door, template lookup, egress filter and hourly cap to a swappable backend, stub, openai-logprobs or jev, and every answer or refusal is journaled, with a calibration loop and the journal on the shared events volume">
  <title>Typryx: an ask crosses the door, template lookup, egress filter and hourly cap to a swappable backend, stub, openai-logprobs or jev, and every answer or refusal is journaled, with a calibration loop and the journal on the shared events volume</title>
  <rect x="-18" y="-18" width="996" height="696" rx="16" fill="#0A0E13"/>
  <rect x="-17.5" y="-17.5" width="995" height="695" rx="15.5" fill="none" stroke="rgba(255,255,255,.09)"/>

        <defs>
          <marker id="txa1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5A6675"/></marker>
          <marker id="txa2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8A97A6"/></marker>
        </defs>
        <g font-family="ui-monospace,Menlo" text-anchor="middle">
          <rect x="30" y="18" width="320" height="48" rx="10" fill="#141C27" stroke="#34D399"/>
          <text x="190" y="40" fill="#E9EFF6" font-size="12" font-weight="700">agent, over MCP</text>
          <text x="190" y="56" fill="#34D399" font-size="10.5">built: Claude Code 2.1.270</text>

          <rect x="30" y="96" width="360" height="54" rx="10" fill="#141C27" stroke="#34D399"/>
          <text x="210" y="118" fill="#E9EFF6" font-size="11.5" font-weight="700">tokenfuse MCP broker</text>
          <text x="210" y="135" fill="#34D399" font-size="10.5">built: named upstream, tool_call recorded</text>

          <rect x="30" y="178" width="440" height="126" rx="14" fill="#10161F" stroke="#60A5FA" stroke-width="1.4"><animate attributeName="stroke-opacity" values="1;.45;1" dur="3.4s" repeatCount="indefinite"/></rect>
          <text x="250" y="202" fill="#60A5FA" font-size="13.5" font-weight="700">typryx</text>
          <rect x="48" y="214" width="82" height="28" rx="7" fill="#141C27" stroke="#2a3547"/><text x="89" y="232" fill="#E9EFF6" font-size="10.5">door</text>
          <rect x="138" y="214" width="98" height="28" rx="7" fill="#141C27" stroke="#2a3547"/><text x="187" y="232" fill="#E9EFF6" font-size="10.5">template</text>
          <rect x="244" y="214" width="120" height="28" rx="7" fill="#141C27" stroke="#2a3547"/><text x="304" y="232" fill="#E9EFF6" font-size="10.5">egress filter</text>
          <rect x="372" y="214" width="88" height="28" rx="7" fill="#141C27" stroke="#2a3547"/><text x="416" y="232" fill="#E9EFF6" font-size="10.5">hourly cap</text>
          <text x="250" y="268" fill="#8A97A6" font-size="10.5">only the fields a template names leave; freeform is opt-in</text>
          <text x="250" y="285" fill="#5A6675" font-size="10.5">1,000 calls/hour by default, counted past door + template + filter</text>

          <rect x="30" y="326" width="440" height="98" rx="14" fill="#10161F" stroke="#2a3547" stroke-width="1.4"/>
          <text x="250" y="350" fill="#E9EFF6" font-size="12.5" font-weight="700">backend, swappable</text>
          <rect x="48" y="362" width="70" height="28" rx="7" fill="#141C27" stroke="#2a3547"/><text x="83" y="380" fill="#E9EFF6" font-size="10.5">stub</text>
          <rect x="126" y="362" width="144" height="28" rx="7" fill="#141C27" stroke="#2a3547"/><text x="198" y="380" fill="#E9EFF6" font-size="10.5">openai-logprobs</text>
          <rect x="278" y="362" width="64" height="28" rx="7" fill="#141C27" stroke="#2a3547"/><text x="310" y="380" fill="#E9EFF6" font-size="10.5">jev</text>
          <text x="250" y="410" fill="#5A6675" font-size="10.5">answer read from the distribution, never the backend&#8217;s claim</text>

          <rect x="30" y="450" width="440" height="58" rx="12" fill="#141C27" stroke="#2a3547"/>
          <text x="250" y="474" fill="#E9EFF6" font-size="12" font-weight="700">typed answer + probability</text>
          <text x="250" y="492" fill="#8A97A6" font-size="10.5">or: unanswered, with a reason &#183; wire omits both fields</text>

          <rect x="30" y="534" width="440" height="72" rx="12" fill="#141C27" stroke="#2a3547"/>
          <text x="250" y="558" fill="#E9EFF6" font-size="12" font-weight="700">journal + ledger</text>
          <text x="250" y="576" fill="#8A97A6" font-size="10.5">4 event types &#183; sha-384 of what left the box</text>
          <text x="250" y="593" fill="#5A6675" font-size="10.5">never the state itself</text>

          <!-- right column: calibration loop -->
          <rect x="546" y="178" width="384" height="150" rx="14" fill="none" stroke="#5A6675" stroke-width="1.2" stroke-dasharray="4 5"/>
          <text x="738" y="200" fill="#8A97A6" font-size="11.5" font-weight="700">the calibration loop</text>
          <rect x="564" y="212" width="180" height="34" rx="8" fill="#141C27" stroke="#5A6675" stroke-dasharray="2 3"/><text x="654" y="233" fill="#8A97A6" font-size="10.5">a later truth</text>
          <rect x="756" y="212" width="156" height="34" rx="8" fill="#141C27" stroke="#5A6675" stroke-dasharray="2 3"/><text x="834" y="233" fill="#8A97A6" font-size="10.5">POST /v1/outcome</text>
          <rect x="564" y="258" width="180" height="34" rx="8" fill="#141C27" stroke="#5A6675" stroke-dasharray="2 3"/><text x="654" y="279" fill="#8A97A6" font-size="10.5">typryx calibration</text>
          <rect x="756" y="258" width="156" height="34" rx="8" fill="#141C27" stroke="#5A6675" stroke-dasharray="2 3"/><text x="834" y="279" fill="#8A97A6" font-size="10.5">calibration_drift</text>
          <text x="738" y="312" fill="#5A6675" font-size="10.5">a bound crossed, per template &#215; version &#215; backend &#215; model</text>

          <rect x="546" y="340" width="384" height="300" rx="14" fill="none" stroke="#5A6675" stroke-width="1.2" stroke-dasharray="4 5"/>
          <text x="738" y="362" fill="#8A97A6" font-size="11" font-weight="700">still planned, or built and not run live</text>
          <rect x="555" y="376" width="366" height="30" rx="8" fill="#141C27" stroke="#FF7AA2" stroke-dasharray="3 3"/><text x="738" y="396" fill="#FF7AA2" font-size="10.5">verdryx: a typed grader beside the LLM judge</text>
          <rect x="555" y="414" width="366" height="30" rx="8" fill="#141C27" stroke="#2DD4BF" stroke-dasharray="3 3"/><text x="738" y="434" fill="#2DD4BF" font-size="10.5">wardryx: a signal that may become a hold, never a deny</text>
          <rect x="555" y="452" width="366" height="30" rx="8" fill="#141C27" stroke="#F4B23E" stroke-dasharray="3 3"/><text x="738" y="472" fill="#F4B23E" font-size="10.5">tokenfuse: router shadow mode</text>
          <rect x="555" y="490" width="366" height="30" rx="8" fill="#141C27" stroke="#7DD3A0" stroke-dasharray="3 3"/><text x="738" y="510" fill="#7DD3A0" font-size="10.5">costcrew: a suggested class or priority at triage (built, opt-in)</text>
          <rect x="555" y="528" width="366" height="30" rx="8" fill="#141C27" stroke="#B48CFF" stroke-dasharray="3 3"/><text x="738" y="548" fill="#B48CFF" font-size="10.5">genaryx: a panel, live only when configured</text>
          <rect x="555" y="566" width="366" height="30" rx="8" fill="#141C27" stroke="#6C7BFF" stroke-dasharray="3 3"/><text x="738" y="586" fill="#6C7BFF" font-size="10.5">engram: an optional importance score</text>
          <text x="738" y="614" fill="#5A6675" font-size="10.5">journal: on the shared events volume:</text>
          <text x="738" y="630" fill="#5A6675" font-size="10.5">Trailryx refuses these four by design</text>
        </g>
        <g stroke="#5A6675" stroke-width="1.5" class="flow">
          <line x1="190" y1="66" x2="210" y2="94" marker-end="url(#txa1)"/>
          <line x1="210" y1="150" x2="230" y2="176" marker-end="url(#txa1)"/>
          <line x1="250" y1="304" x2="250" y2="324" marker-end="url(#txa1)"/>
          <line x1="250" y1="424" x2="250" y2="448" marker-end="url(#txa1)"/>
          <line x1="250" y1="508" x2="250" y2="532" marker-end="url(#txa1)"/>
        </g>
        <g stroke="#5A6675" stroke-width="1.2" stroke-dasharray="3 4" class="flow">
          <path d="M470 570 L544 292" fill="none" marker-end="url(#txa2)"/>
        </g>
        <!-- two animated tokens, both starting together: one an answered ask
             riding the whole path to the ledger, the other stopped at the
             cap and turning ember, which is the branch a reader cannot see
             from the boxes alone -->
        <g class="flow">
          <circle r="5" fill="#34D399" opacity=".9" transform="translate(190,42)">
            <animateMotion begin="0s" dur="7s" repeatCount="indefinite"
              path="M190 42 L190 94 L210 120 L250 190 L250 290 L250 375 L250 479 L250 570"/>
          </circle>
          <circle r="5" fill="#FF574B" opacity="0" transform="translate(190,42)">
            <animateMotion begin="0s" dur="7s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.62;1" calcMode="linear"
              path="M190 42 L190 94 L210 120 L250 190 L416 228"/>
            <animate attributeName="opacity" values="0.9;0.9;0.9;0;0" keyTimes="0;0.62;0.85;0.9;1" begin="0s" dur="7s" repeatCount="indefinite"/>
            <animate attributeName="fill" values="#34D399;#FF574B;#FF574B" keyTimes="0;0.6;1" begin="0s" dur="7s" repeatCount="indefinite"/>
          </circle>
        </g>
      
  <g fill="none">
  <line x1="190" y1="66" x2="210" y2="94" pathLength="100" stroke="#60A5FA" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-0.00s" repeatCount="indefinite"/></line>
  <line x1="210" y1="150" x2="230" y2="176" pathLength="100" stroke="#60A5FA" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-0.37s" repeatCount="indefinite"/></line>
  <line x1="250" y1="304" x2="250" y2="324" pathLength="100" stroke="#60A5FA" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-0.74s" repeatCount="indefinite"/></line>
  <line x1="250" y1="424" x2="250" y2="448" pathLength="100" stroke="#60A5FA" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-1.11s" repeatCount="indefinite"/></line>
  <line x1="250" y1="508" x2="250" y2="532" pathLength="100" stroke="#60A5FA" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-1.48s" repeatCount="indefinite"/></line>
  <path d="M470 570 L544 292" fill="none" pathLength="100" stroke="#60A5FA" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-1.85s" repeatCount="indefinite"/></path>
  </g>
</svg>
